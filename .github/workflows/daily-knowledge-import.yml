name: Daily knowledge import

on:
  schedule:
    # 06:00 UTC todos os dias (~07:00/08:00 em Portugal conforme horário de verão)
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sincronizar fila (se vazia) e importar
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node scripts/daily-knowledge-import.js --sync-only || true
          node scripts/daily-knowledge-import.js
