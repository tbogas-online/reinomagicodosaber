[build]
  command = "node scripts/generate-version.js"
  publish = "public"
  # Só faz deploy automático se o commit tiver [deploy] ou [live] — ver scripts/should-netlify-build.js
  ignore = "node scripts/should-netlify-build.js"

[dev]
  publish = "public"
  port = 8888
  framework = "#static"
  autoLaunch = false
  envFiles = [".env.local", ".env"]

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs"]

[functions."generate"]
  timeout = 26

[functions."report"]
  node_bundler = "esbuild"

[functions."report-attachment"]
  node_bundler = "esbuild"

[functions."reports-admin"]
  node_bundler = "esbuild"

[functions."rooms-admin"]
  node_bundler = "esbuild"

[functions."question-bank-admin"]
  node_bundler = "esbuild"

[functions."gen-telemetry"]
  node_bundler = "esbuild"

[functions."gen-telemetry-admin"]
  node_bundler = "esbuild"

[functions."validation-overrides"]
  node_bundler = "esbuild"

[functions."game-stats-admin"]
  node_bundler = "esbuild"

[functions."knowledge-import-admin"]
  node_bundler = "esbuild"
  included_files = ["./data/knowledge-import-queue.json"]

[functions."quarantine-admin"]
  node_bundler = "esbuild"

[functions."bank-replenish"]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/generate"
  to = "/.netlify/functions/generate"
  status = 200

[[redirects]]
  from = "/api/ai-status"
  to = "/.netlify/functions/ai-status"
  status = 200

[[redirects]]
  from = "/api/report"
  to = "/.netlify/functions/report"
  status = 200

[[redirects]]
  from = "/api/reports-admin"
  to = "/.netlify/functions/reports-admin"
  status = 200

[[redirects]]
  from = "/api/rooms-admin"
  to = "/.netlify/functions/rooms-admin"
  status = 200

[[redirects]]
  from = "/api/question-bank-admin"
  to = "/.netlify/functions/question-bank-admin"
  status = 200

[[redirects]]
  from = "/api/gen-telemetry"
  to = "/.netlify/functions/gen-telemetry"
  status = 200

[[redirects]]
  from = "/api/gen-telemetry-admin"
  to = "/.netlify/functions/gen-telemetry-admin"
  status = 200

[[redirects]]
  from = "/api/validation-overrides"
  to = "/.netlify/functions/validation-overrides"
  status = 200

[[redirects]]
  from = "/api/game-stats-admin"
  to = "/.netlify/functions/game-stats-admin"
  status = 200

[[redirects]]
  from = "/api/knowledge-import-admin"
  to = "/.netlify/functions/knowledge-import-admin"
  status = 200

[[redirects]]
  from = "/api/quarantine-admin"
  to = "/.netlify/functions/quarantine-admin"
