  to = "/.netlify/functions/report-status"
  status = 200

[[redirects]]
  from = "/api/report-attachment"
  to = "/.netlify/functions/report-attachment"
  status = 200

[[redirects]]
  from = "/test-ai.html"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/test-questions.html"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/admin/test-ai"
  to = "/admin/test-ai.html"
  status = 200

[[redirects]]
  from = "/admin/test-questions"
  to = "/admin/test-questions.html"
  status = 200

# A versão deve refletir imediatamente cada novo deploy.
[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, proxy-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/changelog.json"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, proxy-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/app-update.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# Evita que o browser/CDN sirva um index.html antigo após novo deploy.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, proxy-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, proxy-revalidate"
    Pragma = "no-cache"
    Expires = "0"
